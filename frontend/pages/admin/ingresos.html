<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresos — Cafetería MYPE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/pages/ingresos.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        Cafetería MYPE
        <span id="sidebar-usuario"></span>
      </div>
      <nav class="sidebar-nav">
        <a href="/pages/admin/dashboard.html" class="sidebar-link"><span class="material-symbols-outlined">dashboard</span>Dashboard</a>
        <a href="/pages/admin/ingresos.html" class="sidebar-link active"><span class="material-symbols-outlined">payments</span>Ingresos</a>
        <a href="/pages/admin/productos.html" class="sidebar-link"><span class="material-symbols-outlined">coffee</span>Productos</a>
        <a href="/pages/admin/insumos.html" class="sidebar-link"><span class="material-symbols-outlined">category</span>Insumos</a>
        <a href="/pages/admin/stock.html" class="sidebar-link"><span class="material-symbols-outlined">inventory_2</span>Control de Stock</a>
        <a href="/pages/admin/usuarios.html" class="sidebar-link"><span class="material-symbols-outlined">group</span>Usuarios</a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-outline btn-sm" id="btn-logout" style="width:100%">Cerrar sesión</button>
      </div>
    </aside>

    <div class="main-content">
      <div class="page-content">
        <div class="section-header" style="margin-bottom:var(--spacing-lg)">
          <div>
            <h1 class="section-title">Ingresos</h1>
            <p class="text-muted text-sm" style="margin-top:4px">Análisis de ventas del mes, por semana y detalle de boletas</p>
          </div>
        </div>

        <!-- Comparativa mensual -->
        <div class="card" style="margin-bottom:var(--spacing-lg)">
          <div class="ingresos-comp-header">
            <h2 class="font-semibold">Comparativa mensual</h2>
            <div class="ingresos-mes-picker">
              <label class="form-label" for="input-mes">Mes</label>
              <input class="form-input" type="month" id="input-mes">
            </div>
          </div>
          <div class="ingresos-comp-grid" id="comparativa">
            <div class="spinner"></div>
          </div>
        </div>

        <!-- Ingresos por semana -->
        <div class="card" style="margin-bottom:var(--spacing-lg)">
          <h2 class="font-semibold" style="margin-bottom:var(--spacing-md)">Ingresos por semana</h2>
          <div class="chart-container" style="height:280px">
            <canvas id="chart-semanal"></canvas>
          </div>
        </div>

        <!-- Detalle de boletas -->
        <div class="card" style="padding:0;overflow:hidden">
          <div class="ingresos-boletas-header">
            <h2 class="font-semibold" style="font-size:1.125rem">Detalle de boletas</h2>
            <div class="ingresos-rango">
              <input class="form-input" type="date" id="input-desde">
              <span class="text-muted">a</span>
              <input class="form-input" type="date" id="input-hasta">
              <button class="btn btn-secondary btn-sm" id="btn-filtrar">Filtrar</button>
            </div>
          </div>
          <div class="table-wrapper">
            <table class="table">
              <thead>
                <tr>
                  <th>Ticket</th>
                  <th>Fecha</th>
                  <th>Mesero</th>
                  <th style="text-align:right">Total</th>
                </tr>
              </thead>
              <tbody id="boletas-tbody">
                <tr><td colspan="4"><div class="spinner"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/pages/ingresos.js"></script>
  <script type="module">
    import { obtenerUsuario, logout } from '/js/core/auth.js';
    document.getElementById('sidebar-usuario').textContent = obtenerUsuario().nombreCompleto ?? '';
    document.getElementById('btn-logout').addEventListener('click', logout);
  </script>
</body>
</html>
