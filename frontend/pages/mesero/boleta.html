<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boleta — Cafetería MYPE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        Cafetería MYPE
        <span id="sidebar-usuario"></span>
      </div>
      <nav class="sidebar-nav">
        <a href="/pages/mesero/pedidos.html" class="sidebar-link">Nuevo Pedido</a>
        <a href="/pages/mesero/mis-pedidos.html" class="sidebar-link">Mis Pedidos</a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-outline btn-sm" id="btn-logout" style="width:100%">Cerrar sesión</button>
      </div>
    </aside>

    <div class="main-content">
      <div class="page-content" style="max-width:600px;margin:0 auto">
        <h1 class="section-title" style="margin-bottom:24px">Boleta generada</h1>
        <div class="card" id="boleta-contenido">
          <div class="spinner"></div>
        </div>
        <div style="margin-top:16px;display:flex;gap:8px">
          <button class="btn btn-primary" id="btn-nuevo-pedido">Nuevo Pedido</button>
          <button class="btn btn-secondary" onclick="window.print()">Imprimir</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/pages/boleta.js"></script>
  <script type="module">
    import { obtenerUsuario, logout } from '/js/core/auth.js';
    document.getElementById('sidebar-usuario').textContent = obtenerUsuario().nombre ?? '';
    document.getElementById('btn-logout').addEventListener('click', logout);
  </script>
</body>
</html>
