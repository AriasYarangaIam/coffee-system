<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boleta — Cafetería MYPE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/pages/boleta.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:var(--spacing-lg)">
  <main style="width:100%;max-width:420px;margin:0 auto">

    <!-- Spinner inicial -->
    <div id="boleta-spinner" style="text-align:center;padding:40px">
      <div class="spinner" style="margin:0 auto"></div>
    </div>

    <!-- Recibo -->
    <div id="boleta-detalle" class="hidden">

      <!-- Tarjeta de recibo -->
      <div class="card" style="position:relative;overflow:hidden;padding:var(--spacing-xl) var(--spacing-lg)">
        <!-- Borde serrado superior (CSS puro) -->
        <div style="position:absolute;top:0;left:0;right:0;height:8px;background-image:radial-gradient(circle at 5px 0,transparent 5px,var(--color-surface) 6px);background-size:12px 8px;background-repeat:repeat-x;"></div>

        <!-- Cabecera -->
        <div style="text-align:center;padding-top:8px;padding-bottom:var(--spacing-lg);border-bottom:2px dashed var(--color-border)">
          <span class="material-symbols-outlined fill" style="font-size:36px;color:var(--color-primary);margin-bottom:8px;display:block">local_cafe</span>
          <h1 style="font-size:1.25rem;font-weight:700;color:var(--color-primary)">Cafetería MYPE</h1>
          <p class="text-muted text-sm" style="margin-top:2px">Boleta de Venta Electrónica</p>
          <div style="margin-top:var(--spacing-md);padding:var(--spacing-sm) var(--spacing-md);background:var(--color-surface-high);border-radius:var(--border-radius-md);display:flex;justify-content:space-between;align-items:center">
            <span class="text-muted text-sm">Pedido #</span>
            <span style="font-size:1.25rem;font-weight:700;color:var(--color-primary)" id="boleta-ticket">—</span>
          </div>
          <p class="text-muted text-sm" style="margin-top:8px" id="boleta-fecha">—</p>
        </div>

        <!-- Líneas de productos -->
        <div style="padding:var(--spacing-md) 0;border-bottom:2px dashed var(--color-border)">
          <div style="display:grid;grid-template-columns:auto 1fr auto;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--color-border);margin-bottom:4px">
            <p class="text-muted text-sm font-semibold">Cant.</p>
            <p class="text-muted text-sm font-semibold">Artículo</p>
            <p class="text-muted text-sm font-semibold" style="text-align:right">Subtotal</p>
          </div>
          <div id="boleta-lineas"></div>
        </div>

        <!-- Totales -->
        <div style="padding-top:var(--spacing-md);display:flex;flex-direction:column;gap:6px">
          <div style="display:flex;justify-content:space-between" class="text-sm">
            <span class="text-muted">Subtotal</span>
            <span id="boleta-subtotal">S/ 0.00</span>
          </div>
          <div style="display:flex;justify-content:space-between;padding-top:8px;border-top:1px solid var(--color-border);margin-top:4px">
            <span style="font-size:1.125rem;font-weight:600">Total</span>
            <span style="font-size:1.5rem;font-weight:700;color:var(--color-primary)" id="boleta-total">S/ 0.00</span>
          </div>
        </div>

        <!-- Borde serrado inferior -->
        <div style="position:absolute;bottom:0;left:0;right:0;height:8px;background-image:radial-gradient(circle at 5px 8px,transparent 5px,var(--color-surface) 6px);background-size:12px 8px;background-repeat:repeat-x;"></div>
      </div>

      <!-- Acciones -->
      <div style="margin-top:var(--spacing-lg);display:flex;gap:var(--spacing-sm)">
        <button class="btn btn-primary" id="btn-nuevo-pedido" style="flex:1">
          <span class="material-symbols-outlined">add_circle</span>
          Nuevo Pedido
        </button>
        <button class="btn btn-outline" id="btn-imprimir" style="flex:1" onclick="window.print()">
          <span class="material-symbols-outlined">print</span>
          Imprimir
        </button>
      </div>
    </div>

  </main>

  <script type="module" src="/js/pages/boleta.js"></script>
</body>
</html>
