spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    # show-sql: true  # descomentar para ver el SQL de Hibernate en consola (debug)
  jackson:
    time-zone: America/Lima   # serializa fechas con instante en hora Perú (refuerzo de la TZ del JVM)
  application:
    name: backend
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}